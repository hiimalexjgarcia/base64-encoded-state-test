<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Linkboard — Sticky Notes in a Link</title>
    <meta name="description" content="A vanilla TypeScript sticky-note board that keeps every note in the URL — no account, no backend, just share the link.">
    <meta name="theme-color" content="#6b5d4f">
    <meta name="color-scheme" content="light">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Linkboard — Sticky Notes in a Link">
    <meta property="og:description" content="A vanilla TypeScript sticky-note board that keeps every note in the URL — no account, no backend, just share the link.">
    <meta property="og:url" content="https://vigorous-wilson-ce6cfa.netlify.app/">
    <meta property="og:image" content="https://vigorous-wilson-ce6cfa.netlify.app/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="A corkboard with colorful sticky notes">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Linkboard — Sticky Notes in a Link">
    <meta name="twitter:description" content="A vanilla TypeScript sticky-note board that keeps every note in the URL — no account, no backend, just share the link.">
    <meta name="twitter:image" content="https://vigorous-wilson-ce6cfa.netlify.app/og-image.png">
    <meta name="twitter:image:alt" content="A corkboard with colorful sticky notes">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/gh-fork-ribbon.min.css" />
  </head>
  <body>
    <a class="github-fork-ribbon" href="https://github.com/hiimalexjgarcia/linkboard" data-ribbon="Fork me on GitHub" title="Fork me on GitHub">Fork me on GitHub</a>
    <main class="container">
      <h1>Notes</h1>

      <div class="d-flex mb-3 notes-toolbar" role="group" aria-label="Note controls">
        <button type="button" id="addNoteBtn" class="btn btn-primary">Add Note</button>
        <button type="button" id="copyLinkBtn" class="btn">Copy link</button>
        <button type="button" id="clearCompletedBtn" class="btn">Clear completed</button>
        <label class="notes-toolbar-label">
          <input type="checkbox" id="showCompletedCheckbox" />
          Show completed
        </label>
        <span id="notesDisplayCount" class="flex-fill text-right" aria-live="polite" aria-atomic="true"></span>
        <input
          type="search"
          aria-label="Search notes"
          name="q"
          placeholder="🔍"
          id="notesInputSearch" />
      </div>

      <div id="notes" role="list" aria-label="Notes">
      </div>

    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
